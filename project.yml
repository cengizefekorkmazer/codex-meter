name: CodexMeter
options:
  bundleIdPrefix: com.codexmeter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_TESTABILITY: YES

targets:
  CodexMeter:
    type: application
    platform: macOS
    sources:
      - path: CodexMeter
        excludes:
          - "Info.plist"
          - "CodexMeter.entitlements"
    resources:
      - path: CodexMeter/Assets.xcassets
    info:
      path: CodexMeter/Info.plist
      properties:
        CFBundleDisplayName: CodexMeter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 codex-meter contributors. MIT License."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    entitlements:
      path: CodexMeter/CodexMeter.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codexmeter.app
        PRODUCT_NAME: CodexMeter
        GENERATE_INFOPLIST_FILE: NO

  CodexMeterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CodexMeterTests
    dependencies:
      - target: CodexMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codexmeter.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CodexMeter.app/Contents/MacOS/CodexMeter"
